<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</head>
<body style="background-color:lightgreen; padding: 5%;">
    <h1 class="text-center " style="color:green"><span style="color:darkblue;">S</span>mart <span style="color: darkblue;">W</span>allet</h1>
    <h3 class="text-center " style="color:green">Steering Family Finances as One...</h3>
    <div class="row">
        <div class="col row-gap p-5 m-5">
            <img src="https://sneha-webdeveloper.github.io/budget-calculator/images/homeimg.jpg" width="500px" alt="">
        </div>
        <style>
            /* From Uiverse.io by Galahhad */ 
            /* From Uiverse.io by Spacious74 */ 
/* From Uiverse.io by Spacious74 */ 
.container {
  border: solid 1px #8d8d8d;
  padding: 20px;
  border-radius: 20px;
  background-color: #fff;
}

.container .heading {
  font-size: 1.3rem;
  margin-bottom: 20px;
  font-weight: bolder;
}

.form {
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.form .btn-container {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 20px;
}

.form .btn {
  padding: 10px 20px;
  font-size: 1rem;
  text-transform: uppercase;
  letter-spacing: 3px;
  border-radius: 10px;
  border: solid 1px #1034aa;
  border-bottom: solid 1px #90c2ff;
  background: linear-gradient(135deg, #0034de, #006eff);
  color: #fff;
  font-weight: bolder;
  transition: all 0.2s ease;
  box-shadow: 0px 2px 3px #000d3848, inset 0px 4px 5px #0070f0,
    inset 0px -4px 5px #002cbb;
}

.form .btn:active {
  box-shadow: inset 0px 4px 5px #0070f0, inset 0px -4px 5px #002cbb;
  transform: scale(0.995);
}

.input-field {
  position: relative;
}

.input-field label {
  position: absolute;
  color: #8d8d8d;
  pointer-events: none;
  background-color: transparent;
  left: 15px;
  transform: translateY(0.6rem);
  transition: all 0.3s ease;
}

.input-field input {
  padding: 10px 15px;
  font-size: 1rem;
  border-radius: 8px;
  border: solid 1px #8d8d8d;
  letter-spacing: 1px;
  width: 100%;
}

.input-field input:focus,
.input-field input:valid {
  outline: none;
  border: solid 1px #0034de;
}

.input-field input:focus ~ label,
.input-field input:valid ~ label {
  transform: translateY(-51%) translateX(-10px) scale(0.8);
  background-color: #fff;
  padding: 0px 5px;
  color: #0034de;
  font-weight: bold;
  letter-spacing: 1px;
  border: none;
  border-radius: 100px;
}

.form .passicon {
  cursor: pointer;
  font-size: 1.3rem;
  position: absolute;
  top: 6px;
  right: 8px;
}

.form .close {
  display: none;
}

        </style>
           <!-- From Uiverse.io by Galahhad --> 
        <div class="col p-5 m-5">

            <!-- From Uiverse.io by Spacious74 --> 
        <div class="container">
        <div class="heading text-center">Register</div>
        <form class="form" action="">
            <div class="input-field">
            <input
                required=""
                autocomplete="off"
                type="text"
                name="text"
                id="username"
            />
            <label for="username">UserName</label>
            </div>
            <div class="input-field">
            <input
                required=""
                autocomplete="off"
                type="email"
                name="email"
                id="email"
            />
            <label for="email">Email Id</label>
            </div>
            <div class="input-field">
            <input
                required=""
                autocomplete="off"
                type="password"
                name="text"
                id="password"
            />
            <label for="username">Password</label>
            </div>

            <div class="btn-container">
            <button class="btn" onclick="Register()">Register</button>
            
            </div>
            <div>
                <a href="./login.html"></a>
            </div>
        </form>
    </div>


    </body>
    <script>
  function Register()
{
    const user = {
        username: document.getElementById('username').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };

    if (user.email in localStorage)
    {
        alert("User Already Registered");
    }
    else
    {
        localStorage.setItem(user.email, JSON.stringify(user));

        console.log(user.email, user.username, user.password);

        alert("User Registration Successful");
         window.location='./login.html'
    }

    document.getElementById('myform').reset();
}

</script>
</html>
